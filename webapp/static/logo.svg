<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-label="流动性流向 × 趋势">
  <!--
    标识含义：一条零线，上面一根多腿、下面一根空腿 —— 就是这套策略的形状
    （横截面市场中性）。零线只画在两根柱子的**间隙里**：画到两端会变成"翅膀"，
    22px 下看着像一根棍子挑着两个点。
    颜色写死（不用 CSS 变量）：同一个文件既做页头图标又做 favicon，而 favicon
    读不到页面的主题变量。蓝底白柱在明暗两种主题下都成立。
  -->
  <defs>
    <linearGradient id="lsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#lsGrad)"/>
  <!-- 零线：只在两根柱子之间 -->
  <path d="M12.6 16H19.4" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity=".45"/>
  <!-- 多腿（零线之上） -->
  <rect x="7" y="5" width="6.6" height="11" rx="3.3" fill="#ffffff"/>
  <!-- 空腿（零线之下） -->
  <rect x="18.4" y="16" width="6.6" height="11" rx="3.3" fill="#ffffff" opacity=".72"/>
</svg>
